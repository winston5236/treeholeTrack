<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺北市路樹狀況追蹤</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary-color: #2E7D32; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: "Microsoft JhengHei", sans-serif; display: flex; flex-direction: column; }
        
        header {
            background: var(--primary-color); color: white;
            padding: 15px 20px; display: flex; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 1001;
        }

        #map { flex-grow: 1; width: 100%; position: relative; background: #f0f0f0; }

        /* 左下角說明視窗 */
        .info-panel {
            position: absolute; bottom: 25px; left: 10px; width: 280px;
            background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); z-index: 1000; font-size: 13px; line-height: 1.5;
            border-left: 6px solid var(--primary-color);
        }
        .info-panel h4 { margin: 0 0 8px 0; color: #333; font-size: 15px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
        .level-item { margin-bottom: 8px; }
        .level-tag { display: inline-block; width: 25px; font-weight: bold; border-radius: 3px; text-align: center; color: white; margin-right: 8px; }

        /* 按鈕與表單 */
        .add-btn { 
            background: var(--primary-color); width: 50px; height: 50px; 
            font-size: 30px; color: white; border-radius: 50%; border: none; 
            cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3); 
        }

        #form-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 320px; background: white; padding: 25px; border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); z-index: 2000; display: none;
        }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 3px; }
        .input-group input, .input-group select, .input-group textarea { 
            width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; 
        }
        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .save-btn { flex: 2; background: var(--primary-color); color: white; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .cancel-btn { flex: 1; background: #eee; border: none; padding: 12px; cursor: pointer; border-radius: 6px; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 22px; font-weight: bold; letter-spacing: 1px;">臺北市路樹狀況追蹤</div>
</header>

<div id="map">
    <div class="info-panel">
        <h4>破壞程度分級標準</h4>
        <div class="level-item"><span class="level-tag" style="background:#2ECC71">L1</span> <b>輕微：</b>細微裂縫，延伸 < 1/4 路寬。</div>
        <div class="level-item"><span class="level-tag" style="background:#F1C40F">L2</span> <b>中度：</b>隆起 < 2cm，地磚位移，1/4-1/2 路寬。</div>
        <div class="level-item"><span class="level-tag" style="background:#E67E22">L3</span> <b>嚴重：</b>隆起 > 2cm，地磚破碎，> 1/2 路寬。</div>
        <div class="level-item"><span class="level-tag" style="background:#E74C3C">L4</span> <b>極致：</b>圍框斷裂，根系裸露，完全無法通行。</div>
    </div>
</div>

<!-- 表單視窗 -->
<div id="form-container">
    <h3 style="margin:0 0 15px 0; color:var(--primary-color);">新增樹木觀測資料</h3>
    <div class="input-group">
        <label>點座標 N (緯度)</label>
        <input type="number" id="lat" step="0.000001" placeholder="例如: 25.033000">
    </div>
    <div class="input-group">
        <label>點座標 E (經度)</label>
        <input type="number" id="lng" step="0.000001" placeholder="例如: 121.565400">
    </div>
    <div class="input-group">
        <label>破壞等級</label>
        <select id="damage_level">
            <option value="1">L1 (輕微)</option>
            <option value="2">L2 (中度)</option>
            <option value="3">L3 (嚴重)</option>
            <option value="4">L4 (極致)</option>
        </select>
    </div>
    <div class="input-group"><label>樹種</label><input type="text" id="species"></div>
    <div class="input-group">
        <label>樹圍 (cm) / 樹穴面積 (cm²)</label>
